id: nyc_yellow_taxi_elt
namespace: universidad.semana07
description: >
  Crea la infraestructura necesaria en Snowflake y carga NYC Yellow Taxi en
  Bronze de forma idempotente. Silver y Gold se construyen manualmente con dbt.

inputs:
  - id: periods
    type: ARRAY
    itemType: STRING
    description: Periodos YYYY-MM que se descargarán desde NYC TLC.
    defaults:
      - "2025-01"
      - "2025-02"
      - "2025-03"
      - "2025-04"
      - "2025-05"
      - "2025-06"
      - "2025-07"
      - "2025-08"
      - "2025-09"
      - "2025-10"
      - "2025-11"
      - "2025-12"
      - "2026-01"
      - "2026-02"
      - "2026-03"
      - "2026-04"
      - "2026-05"
      - "2026-06"
      - "2026-07"
      # Agregar "2026-08" cuando el archivo oficial deje de responder 403.

tasks:
  - id: setup_snowflake
    type: io.kestra.plugin.jdbc.snowflake.Queries
    description: Crea warehouse, base, schemas, tablas Bronze, stage y file format.
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?role={{ envs.snowflake_role }}"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    transaction: false
    sql: |
      CREATE WAREHOUSE IF NOT EXISTS {{ envs.snowflake_warehouse }}
        WAREHOUSE_SIZE = 'X-SMALL'
        AUTO_SUSPEND = 60
        AUTO_RESUME = TRUE
        INITIALLY_SUSPENDED = TRUE;

      CREATE DATABASE IF NOT EXISTS {{ envs.snowflake_database }};

      CREATE SCHEMA IF NOT EXISTS {{ envs.snowflake_database }}.BRONZE;
      CREATE SCHEMA IF NOT EXISTS {{ envs.snowflake_database }}.SILVER;
      CREATE SCHEMA IF NOT EXISTS {{ envs.snowflake_database }}.GOLD;

      CREATE FILE FORMAT IF NOT EXISTS
        {{ envs.snowflake_database }}.BRONZE.NYC_TAXI_PARQUET_FORMAT
        TYPE = PARQUET
        USE_LOGICAL_TYPE = TRUE;

      CREATE STAGE IF NOT EXISTS
        {{ envs.snowflake_database }}.BRONZE.NYC_TAXI_STAGE;

      CREATE TABLE IF NOT EXISTS
        {{ envs.snowflake_database }}.BRONZE.YELLOW_TAXI_RAW (
          RAW_RECORD VARIANT NOT NULL,
          SOURCE_FILE VARCHAR NOT NULL,
          SOURCE_PERIOD VARCHAR(7) NOT NULL,
          LOADED_AT TIMESTAMP_TZ NOT NULL
        );

      CREATE TABLE IF NOT EXISTS
        {{ envs.snowflake_database }}.BRONZE.TAXI_ZONE_LOOKUP_RAW (
          LOCATION_ID NUMBER,
          BOROUGH VARCHAR,
          ZONE VARCHAR,
          SERVICE_ZONE VARCHAR,
          SOURCE_FILE VARCHAR NOT NULL,
          LOADED_AT TIMESTAMP_TZ NOT NULL
        );

  - id: download_zone_lookup
    type: io.kestra.plugin.core.http.Download
    uri: https://d37ci6vzurychx.cloudfront.net/misc/taxi_zone_lookup.csv

  - id: upload_zone_lookup
    type: io.kestra.plugin.jdbc.snowflake.Upload
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&schema={{ envs.snowflake_schema }}&role={{ envs.snowflake_role }}"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    from: "{{ outputs.download_zone_lookup.uri }}"
    stageName: "@LAB_SEMANA_07_DB.BRONZE.NYC_TAXI_STAGE"
    prefix: zones
    fileName: taxi_zone_lookup.csv
    compress: false

  - id: clear_zone_lookup
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&schema={{ envs.snowflake_schema }}&role={{ envs.snowflake_role }}"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    sql: DELETE FROM LAB_SEMANA_07_DB.BRONZE.TAXI_ZONE_LOOKUP_RAW

  - id: load_zone_lookup
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&schema={{ envs.snowflake_schema }}&role={{ envs.snowflake_role }}"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    sql: |
      COPY INTO LAB_SEMANA_07_DB.BRONZE.TAXI_ZONE_LOOKUP_RAW
        (LOCATION_ID, BOROUGH, ZONE, SERVICE_ZONE, SOURCE_FILE, LOADED_AT)
      FROM (
        SELECT
          TRY_TO_NUMBER(t.$1),
          t.$2::VARCHAR,
          t.$3::VARCHAR,
          t.$4::VARCHAR,
          METADATA$FILENAME,
          METADATA$START_SCAN_TIME
        FROM @LAB_SEMANA_07_DB.BRONZE.NYC_TAXI_STAGE/zones t
      )
      FILE_FORMAT = (
        TYPE = CSV
        SKIP_HEADER = 1
        FIELD_OPTIONALLY_ENCLOSED_BY = '"'
      )
      FORCE = TRUE
      ON_ERROR = ABORT_STATEMENT;

  - id: ingest_months
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{ inputs.periods }}"
    concurrencyLimit: 1
    tasks:
      - id: download_trip_file
        type: io.kestra.plugin.core.http.Download
        uri: "https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_{{ taskrun.value }}.parquet"
        retry:
          type: constant
          interval: PT30S
          maxAttempt: 3

      - id: upload_trip_file
        type: io.kestra.plugin.jdbc.snowflake.Upload
        url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&schema={{ envs.snowflake_schema }}&role={{ envs.snowflake_role }}"
        username: "{{ envs.snowflake_user }}"
        password: "{{ envs.snowflake_password }}"
        from: "{{ outputs.download_trip_file[taskrun.value].uri }}"
        stageName: "@LAB_SEMANA_07_DB.BRONZE.NYC_TAXI_STAGE"
        prefix: "trips/{{ taskrun.value }}"
        fileName: "yellow_tripdata_{{ taskrun.value }}.parquet"
        compress: false

      - id: clear_bronze_period
        type: io.kestra.plugin.jdbc.snowflake.Query
        url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&schema={{ envs.snowflake_schema }}&role={{ envs.snowflake_role }}"
        username: "{{ envs.snowflake_user }}"
        password: "{{ envs.snowflake_password }}"
        sql: |
          DELETE FROM LAB_SEMANA_07_DB.BRONZE.YELLOW_TAXI_RAW
          WHERE SOURCE_PERIOD = '{{ taskrun.value }}'

      - id: load_bronze_period
        type: io.kestra.plugin.jdbc.snowflake.Query
        url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&schema={{ envs.snowflake_schema }}&role={{ envs.snowflake_role }}"
        username: "{{ envs.snowflake_user }}"
        password: "{{ envs.snowflake_password }}"
        sql: |
          COPY INTO LAB_SEMANA_07_DB.BRONZE.YELLOW_TAXI_RAW
            (RAW_RECORD, SOURCE_FILE, SOURCE_PERIOD, LOADED_AT)
          FROM (
            SELECT
              t.$1,
              METADATA$FILENAME,
              '{{ taskrun.value }}',
              METADATA$START_SCAN_TIME
            FROM @LAB_SEMANA_07_DB.BRONZE.NYC_TAXI_STAGE/trips/{{ taskrun.value }} t
          )
          FILE_FORMAT = (
            FORMAT_NAME = 'LAB_SEMANA_07_DB.BRONZE.NYC_TAXI_PARQUET_FORMAT'
          )
          FORCE = TRUE
          ON_ERROR = ABORT_STATEMENT;

  - id: validate_bronze
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&schema={{ envs.snowflake_schema }}&role={{ envs.snowflake_role }}"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    sql: |
      SELECT
        COUNT(*) AS BRONZE_ROWS,
        COUNT(DISTINCT SOURCE_PERIOD) AS LOADED_PERIODS,
        MIN(SOURCE_PERIOD) AS FIRST_PERIOD,
        MAX(SOURCE_PERIOD) AS LAST_PERIOD
      FROM LAB_SEMANA_07_DB.BRONZE.YELLOW_TAXI_RAW;
    fetchType: FETCH

triggers:
  - id: manual_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 3 1 * *"
    disabled: true
