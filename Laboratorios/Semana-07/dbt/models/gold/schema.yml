version: 2

models:
  - name: dim_date
    columns:
      - name: date_key
        tests: [not_null, unique]

  - name: dim_vendor
    columns:
      - name: vendor_key
        tests: [not_null, unique]

  - name: dim_payment_type
    columns:
      - name: payment_type_key
        tests: [not_null, unique]

  - name: dim_rate_code
    columns:
      - name: rate_code_key
        tests: [not_null, unique]

  - name: dim_location
    columns:
      - name: location_key
        tests: [not_null, unique]
      - name: is_known_location
        data_tests: [not_null]

  - name: fct_trips
    description: >
      Una fila por registro Yellow Taxi deduplicado y estructuralmente válido.
      Conserva ajustes financieros y advertencias mediante indicadores explícitos.
    columns:
      - name: trip_key
        tests: [not_null, unique]
      - name: vendor_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_vendor')
                field: vendor_key
      - name: rate_code_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_rate_code')
                field: rate_code_key
      - name: payment_type_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_payment_type')
                field: payment_type_key
      - name: pickup_location_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key
      - name: dropoff_location_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key
      - name: pickup_date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: dropoff_date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: quality_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['VALID', 'VALID_WITH_WARNINGS']

      - name: is_analytically_valid
        data_tests: [not_null]

      - name: is_financial_adjustment
        data_tests: [not_null]

      - name: is_missing_passenger_count
        data_tests: [not_null]

      - name: is_extreme_duration
        data_tests: [not_null]

      - name: is_zero_distance
        data_tests: [not_null]

      - name: is_zero_total
        data_tests: [not_null]

      - name: is_source_period_mismatch
        data_tests: [not_null]
