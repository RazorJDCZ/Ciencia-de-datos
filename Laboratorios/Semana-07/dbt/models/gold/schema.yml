version: 2

models:
  - name: dim_date
    columns:
      - name: date_key
        tests: [not_null, unique]

  - name: dim_vendor
    columns:
      - name: vendor_key
        tests: [not_null, unique]

  - name: dim_payment_type
    columns:
      - name: payment_type_key
        tests: [not_null, unique]

  - name: dim_rate_code
    columns:
      - name: rate_code_key
        tests: [not_null, unique]

  - name: dim_location
    columns:
      - name: location_key
        tests: [not_null, unique]

  - name: fct_trips
    description: Una fila por viaje Yellow Taxi válido y deduplicado.
    columns:
      - name: trip_key
        tests: [not_null, unique]
      - name: vendor_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_vendor')
                field: vendor_key
      - name: rate_code_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_rate_code')
                field: rate_code_key
      - name: payment_type_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_payment_type')
                field: payment_type_key
      - name: pickup_location_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key
      - name: dropoff_location_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key
      - name: pickup_date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: dropoff_date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
